<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Profesores</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-principal: #f8fafc;
            --azul-oscuro: #0f172a;
            --azul-indigo: #4f46e5;
            --texto-principal: #334155;
            --borde: #e2e8f0;
            --exito: #10b981;
            --alerta: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            padding: 30px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--borde);
        }

        h1 {
            color: var(--azul-oscuro);
            font-size: 1.8rem;
        }

        .btn-refresh {
            background-color: var(--azul-indigo);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background-color: #4338ca;
        }

        .grid-alumnos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .tarjeta-alumno {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--borde);
            border-top: 5px solid var(--azul-indigo);
            transition: transform 0.2s;
        }

        .tarjeta-alumno:hover {
            transform: translateY(-2px);
        }

        .tarjeta-alumno h3 {
            color: var(--azul-oscuro);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .tarjeta-alumno .email-sub {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
            display: block;
        }

        .stats-globales {
            display: flex;
            justify-content: space-between;
            background-color: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-item:not(:last-child) {
            border-right: 1px solid var(--borde);
        }

        .stat-val {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--azul-indigo);
        }

        .stat-val.alto { color: var(--exito); }
        .stat-val.bajo { color: var(--alerta); }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 2px;
        }

        .grafico-container {
            position: relative;
            height: 220px;
            width: 100%;
        }

        .mensaje-estado {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #64748b;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>Panel de Seguimiento Académico 🎓</h1>
        <button onclick="cargarEstadisticas()" class="btn-refresh">🔄 Actualizar Datos</button>
    </header>

    <div id="contenedor-alumnos" class="grid-alumnos">
        <div class="mensaje-estado">Cargando datos de Supabase...</div>
    </div>
</div>

<script src="profesor.js"></script>

</body>
</html>
