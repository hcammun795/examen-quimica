<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Química - Panel del Alumno</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --error: #e74c3c; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .hidden { display: none !important; }
        h2, h3 { color: var(--dark); text-align: center; }
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem;
        }
        button { 
            width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; margin-top: 10px;
        }
        button:hover { filter: brightness(0.9); }
        .type-selector { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #eee; max-height: 250px; overflow-y: auto; }
        .formula { font-size: 2.5rem; text-align: center; margin: 20px 0; color: var(--dark); letter-spacing: 2px; min-height: 60px; }
        sub { font-size: 1.2rem; bottom: -0.2em; color: var(--primary); }
        .feedback { padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: bold; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <div id="login-section">
        <h2>Acceso Alumno</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Entrar al Examen</button>
    </div>

    <div id="config-panel" class="hidden">
        <h3>¿Qué quieres repasar?</h3>
        <p style="text-align:center; color:#666;">Selecciona los temas:</p>
        <div id="lista-tipos" class="type-selector">
            Cargando temas...
        </div>
        <button onclick="empezarExamen()">Empezar Examen</button>
    </div>

    <div id="exam-section" class="hidden">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <span id="user-display" style="font-size:0.8rem; color:#95a5a6;"></span>
            <button onclick="location.reload()" style="width:auto; padding:5px 10px; font-size:0.7rem; background:#95a5a6;">Cerrar Sesión</button>
        </div>
        <hr>
        <p id="instruccion" style="text-align:center; color:#666; font-style:italic; margin-top:15px;"></p>
        <div id="pregunta-display" class="formula"></div>
        <input type="text" id="respuesta-alumno" placeholder="Escribe tu respuesta..." autocomplete="off">
        <button id="btn-comprobar" onclick="comprobar()">Comprobar</button>
        
        <div id="feedback" class="feedback hidden"></div>
        <button id="btn-siguiente" class="hidden" onclick="nuevaPregunta()" style="background:var(--dark)">Siguiente Compuesto</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
